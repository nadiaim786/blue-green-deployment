apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
  namespace: expt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      version: blue
  template:
    metadata:
      labels:
        app: bg-app
        version: blue
    spec:
      containers:
        - name: app
          image: exp2:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80